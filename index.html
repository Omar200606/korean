<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слушаем, как звучат корейские буквы и слова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E3%85%8B%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:#23243a;
    background:#f6f5fd;
    background-image:linear-gradient(160deg,#f3f1ff 0%,#faf6f3 55%,#f4f0fb 100%);
    -webkit-font-smoothing:antialiased;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  .blob-a{width:420px;height:420px;background:#dcd6ff;top:-140px;right:-120px;opacity:.7}
  .blob-b{width:380px;height:380px;background:#ffd9e8;bottom:-160px;left:-140px;opacity:.6}

  .wrap{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:56px 20px 72px}

  .hero{text-align:center;margin-bottom:40px}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;letter-spacing:.04em;color:#6a5fd8;
    background:rgba(255,255,255,.8);border:1px solid #e7e3fb;
    padding:6px 14px;border-radius:999px;
    box-shadow:0 2px 10px rgba(90,80,200,.08);
  }
  h1{
    margin-top:16px;font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.01em;line-height:1.25;
    background:linear-gradient(92deg,#4f46e5,#9333ea 55%,#db2777);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .card{
    background:rgba(255,255,255,.92);
    border:1px solid #ecebf6;border-radius:24px;padding:26px 26px 24px;
    box-shadow:0 12px 32px rgba(76,63,180,.10);
    animation:rise .6s ease both;animation-delay:var(--d,0s);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(76,63,180,.14)}
  .card+.card{margin-top:22px}

  .head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .num{
    flex:none;width:40px;height:40px;border-radius:14px;
    display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    box-shadow:0 6px 14px rgba(124,58,237,.35);
  }
  h2{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.01em;padding-top:2px}
  .pill{
    display:inline-block;margin-top:8px;
    font-size:14px;font-weight:600;color:#5b21b6;
    background:#f3efff;border:1px solid #e6ddfa;
    padding:5px 12px;border-radius:999px;
  }

  .player{
    display:flex;align-items:center;gap:16px;
    background:#f7f6fd;border:1px solid #eeebf9;border-radius:18px;
    padding:12px 16px;
  }
  .btn{
    flex:none;width:52px;height:52px;border:none;border-radius:50%;
    display:grid;place-items:center;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    box-shadow:0 8px 18px rgba(124,58,237,.35);
    transition:transform .15s ease;
  }
  .btn:hover{transform:scale(1.06)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible,.wave:focus-visible{outline:3px solid #c7bfff;outline-offset:2px}
  .btn svg{margin-left:2px}
  .btn.playing svg{margin-left:0}

  .wave{display:flex;align-items:center;gap:3px;height:46px;flex:1;cursor:pointer;touch-action:none}
  .wave span{flex:1;max-width:5px;min-width:2px;border-radius:99px;background:#dcdcef;transition:background .12s linear}
  .wave span.on{background:linear-gradient(180deg,#8b5cf6,#6366f1)}

  .time{flex:none;font-size:13px;font-weight:600;color:#8a8ca6;font-variant-numeric:tabular-nums;white-space:nowrap}
  .time .sep{margin:0 4px;opacity:.6}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}}
  @media (max-width:480px){
    .wrap{padding-top:40px}
    .card{padding:20px 18px}
    .player{gap:10px;padding:10px 12px}
    .time{font-size:12px}
  }
</style>
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <main class="wrap">
    <header class="hero">
      <span class="kicker">한국어 · корейский</span>
      <h1>Слушаем, как звучат корейские буквы и слова</h1>
    </header>

    <section class="card" style="--d:.05s">
      <div class="head">
        <span class="num">1</span>
        <div>
          <h2>Корейская буква в русском слове</h2>
          <span class="pill">Тробуз</span>
        </div>
      </div>
      <div class="player" data-src="audio/1.mp3">
        <button class="btn" aria-label="Слушать"></button>
        <div class="wave"></div>
        <div class="time"><span class="t-cur">0:00</span><span class="sep">/</span><span class="t-dur">--:--</span></div>
      </div>
    </section>

    <section class="card" style="--d:.15s">
      <div class="head">
        <span class="num">2</span>
        <div>
          <h2>Пример корейского слова</h2>
          <span class="pill">Ота — ребёнок</span>
        </div>
      </div>
      <div class="player" data-src="audio/2.mp3">
        <button class="btn" aria-label="Слушать"></button>
        <div class="wave"></div>
        <div class="time"><span class="t-cur">0:00</span><span class="sep">/</span><span class="t-dur">--:--</span></div>
      </div>
    </section>
  </main>

<script>
  const PLAY  = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8.5 5.2v13.6L19 12z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7.5 5h3.4v14H7.5zM13.1 5h3.4v14h-3.4z"/></svg>';

  function fmt(t){
    if(!isFinite(t)||t<0) return '0:00';
    const m=Math.floor(t/60), s=Math.floor(t%60);
    return m+':'+String(s).padStart(2,'0');
  }

  document.querySelectorAll('.player').forEach((root,pi)=>{
    const audio=new Audio(root.dataset.src);
    audio.preload='metadata';
    audio.hidden=true;
    root.appendChild(audio);

    const btn=root.querySelector('.btn');
    const wave=root.querySelector('.wave');
    const cur=root.querySelector('.t-cur');
    const dur=root.querySelector('.t-dur');

    // декоративная волна из полосок, своя у каждого плеера
    const N=52, bars=[];
    for(let i=0;i<N;i++){
      const b=document.createElement('span');
      const h=18+74*Math.abs(Math.sin(i*.83+pi*1.7)*.55+Math.sin(i*2.17+pi)*.45);
      b.style.height=Math.max(12,Math.min(96,h)).toFixed(0)+'%';
      wave.appendChild(b); bars.push(b);
    }

    function paint(){
      const p=isFinite(audio.duration)&&audio.duration>0 ? audio.currentTime/audio.duration : 0;
      const upto=Math.round(p*N);
      bars.forEach((b,i)=>b.classList.toggle('on',i<upto));
      cur.textContent=fmt(audio.currentTime);
      wave.setAttribute('aria-valuenow',String(Math.round(p*100)));
    }
    function setIcon(playing){
      btn.innerHTML=playing?PAUSE:PLAY;
      btn.setAttribute('aria-label',playing?'Пауза':'Слушать');
      btn.classList.toggle('playing',playing);
    }
    setIcon(false);

    btn.addEventListener('click',()=>{
      if(audio.paused){
        document.querySelectorAll('.player').forEach(o=>{ if(o!==root) o._pause(); });
        audio.play().catch(()=>{});
      } else audio.pause();
    });
    root._pause=()=>audio.pause();

    audio.addEventListener('play',()=>setIcon(true));
    audio.addEventListener('pause',()=>{setIcon(false);paint();});
    audio.addEventListener('timeupdate',paint);
    audio.addEventListener('ended',()=>{audio.currentTime=0;setIcon(false);paint();});
    audio.addEventListener('loadedmetadata',()=>{dur.textContent=fmt(audio.duration);});
    audio.addEventListener('error',()=>{
      wave.style.opacity='.35';
      cur.textContent='—';
      btn.disabled=true;
      btn.title='Не удалось загрузить аудио';
    });

    // перемотка кликом, перетаскиванием и с клавиатуры
    let dragging=false;
    function seek(e){
      if(!isFinite(audio.duration)) return;
      const r=wave.getBoundingClientRect();
      const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      audio.currentTime=x*audio.duration;
      paint();
    }
    wave.setAttribute('role','slider');
    wave.setAttribute('aria-label','Перемотка');
    wave.setAttribute('aria-valuemin','0');
    wave.setAttribute('aria-valuemax','100');
    wave.setAttribute('aria-valuenow','0');
    wave.tabIndex=0;
    wave.addEventListener('pointerdown',e=>{dragging=true;wave.setPointerCapture(e.pointerId);seek(e);});
    wave.addEventListener('pointermove',e=>{if(dragging)seek(e);});
    wave.addEventListener('pointerup',()=>dragging=false);
    wave.addEventListener('pointercancel',()=>dragging=false);
    wave.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'){audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);paint();e.preventDefault();}
      if(e.key==='ArrowLeft'){audio.currentTime=Math.max(0,audio.currentTime-5);paint();e.preventDefault();}
    });
  });
</script>
</body>
</html>
